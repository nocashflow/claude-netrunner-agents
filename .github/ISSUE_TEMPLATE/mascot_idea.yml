name: Mascot or cosmetic idea
description: A new crew member, colour or bit of chrome.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What it looks like and which agent type it'd suit. A rough sketch is more than welcome.
    validations:
      required: true
  - type: checkboxes
    id: original
    attributes:
      label: Original art
      options:
        - label: It's my own idea, not a copy of a character from a game, show or company.
          required: true
